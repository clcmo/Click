name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testes unitários, lint e APK de debug
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Relatórios de teste e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: APK de debug (para testar no celular)
        uses: actions/upload-artifact@v4
        with:
          name: click-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
